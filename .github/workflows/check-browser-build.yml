name: Check browser game build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-desktop:
    name: Static checks + desktop smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate Python syntax
        run: python -m py_compile main.py ping_pong_cinematic.py
      - name: Web-compatibility regression tests (static)
        run: python -m pytest tests/test_web_compat.py -v
      - name: Desktop smoke test (SDL dummy drivers, synthetic audio enabled)
        run: python -m pytest tests/desktop_smoke_test.py -v

  browser:
    name: Build + real browser runtime test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt playwright
          python -m playwright install --with-deps chromium
      - name: Build browser game with Pygbag
        run: python -m pygbag --build --ume_block=0 --title "Ping Pong - Cinematic Skill Edition" .
      - name: Verify APK contents and startup configuration
        run: |
          python - <<'PY'
          import glob, re, zipfile
          apks = glob.glob("build/web/*.apk")
          assert len(apks) == 1, f"expected exactly one APK, got {apks}"
          with zipfile.ZipFile(apks[0]) as z:
              names = set(z.namelist())
              for need in ("assets/main.py", "assets/ping_pong_cinematic.py"):
                  assert need in names, f"{need} missing from APK: {sorted(names)}"
              reqs = z.read("assets/requirements.txt").decode().lower()
          lines = [l.strip() for l in reqs.splitlines() if l.strip() and not l.lstrip().startswith("#")]
          assert any(re.match(r"^pygame-ce(?:[<=>!~]|$)", l) for l in lines), lines
          assert not any(re.match(r"^pygame(?:[<=>!~]|$)", l) for l in lines), lines
          html = open("build/web/index.html", encoding="utf-8").read()
          assert re.search(r"ume_block\s*:\s*0", html), "ume_block must be 0"
          print("APK and index.html OK:", apks[0], lines)
          PY
      - name: Real browser test (Chromium) - boot, first frame, keyboard, pause
        run: python tests/browser_smoke_test.py build/web
