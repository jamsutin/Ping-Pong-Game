name: Check browser game build

on:
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "ping_pong_cinematic.py"
      - "requirements-web.txt"
      - ".github/workflows/check-browser-build.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install web build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt

      - name: Build browser game without media gate
        run: python -m pygbag --build --ume_block=0 --title "Ping Pong - Cinematic Skill Edition" .

      - name: Disable browser audio bootstrap and obsolete BrowserFS request
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("build/web/index.html")
          html = path.read_text(encoding="utf-8")
          html, removed = re.subn(
              r'<script\s+src="[^"]*browserfs\.min\.js"[^>]*>\s*</script>',
              '',
              html,
              flags=re.IGNORECASE,
          )
          if removed != 1:
              raise SystemExit(f"Expected 1 obsolete BrowserFS script, removed {removed}")

          match = re.search(r'data-os="([^"]+)"', html)
          if not match:
              raise SystemExit("Pygbag data-os setting was not found")
          tags = [tag for tag in match.group(1).split(",") if tag != "snd"]
          html = html[:match.start(1)] + ",".join(tags) + html[match.end(1):]
          path.write_text(html, encoding="utf-8")
          PY

      - name: Verify browser startup configuration
        run: |
          test -f build/web/index.html
          grep -Eq 'ume_block[[:space:]]*:[[:space:]]*0' build/web/index.html
          ! grep -q 'browserfs.min.js' build/web/index.html
          ! grep -Eq 'data-os="[^"]*snd' build/web/index.html
          echo "Browser build has no SDL audio bootstrap or obsolete BrowserFS loader."
