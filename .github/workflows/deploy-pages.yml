name: Build and deploy browser game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Install build + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Validate Python syntax
        run: python -m py_compile main.py ping_pong_cinematic.py
      - name: Web-compatibility regression tests (static)
        run: python -m pytest tests/test_web_compat.py -v
      - name: Build Pygbag web app without media gate
        run: python -m pygbag --build --ume_block=0 --title "Ping Pong - Cinematic Skill Edition" .
      - name: Verify APK contents and startup configuration
        run: |
          python - <<'PY'
          import glob, re, zipfile
          apks = glob.glob("build/web/*.apk")
          assert len(apks) == 1, f"expected exactly one APK, got {apks}"
          with zipfile.ZipFile(apks[0]) as z:
              names = set(z.namelist())
              for need in ("assets/main.py", "assets/ping_pong_cinematic.py"):
                  assert need in names, f"{need} missing from APK: {sorted(names)}"
              reqs = z.read("assets/requirements.txt").decode().lower()
          lines = [l.strip() for l in reqs.splitlines() if l.strip() and not l.lstrip().startswith("#")]
          assert any(re.match(r"^pygame-ce(?:[<=>!~]|$)", l) for l in lines), lines
          assert not any(re.match(r"^pygame(?:[<=>!~]|$)", l) for l in lines), lines
          html = open("build/web/index.html", encoding="utf-8").read()
          assert re.search(r"ume_block\s*:\s*0", html), "ume_block must be 0"
          print("APK and index.html OK:", apks[0], lines)
          PY
      - name: Real browser test (Chromium) BEFORE deploying
        run: python tests/browser_smoke_test.py build/web
      - name: Disable Jekyll
        run: touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify the deployed site in a real browser
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Smoke-test the live GitHub Pages URL
        run: python tests/browser_smoke_test.py "https://jamsutin.github.io/Ping-Pong-Game/"
