name: Build and deploy browser game

on:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "ping_pong_cinematic.py"
      - "requirements-web.txt"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install web build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt

      - name: Build Pygbag web app without media gate
        run: python -m pygbag --build --ume_block=0 --title "Ping Pong - Cinematic Skill Edition" .

      - name: Disable browser audio bootstrap and obsolete BrowserFS request
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("build/web/index.html")
          html = path.read_text(encoding="utf-8")

          html, removed = re.subn(
              r'<script\s+src="[^"]*browserfs\.min\.js"[^>]*>\s*</script>',
              '',
              html,
              flags=re.IGNORECASE,
          )
          if removed != 1:
              raise SystemExit(f"Expected 1 obsolete BrowserFS script, removed {removed}")

          match = re.search(r'data-os="([^"]+)"', html)
          if not match:
              raise SystemExit("Pygbag data-os setting was not found")
          tags = [tag for tag in match.group(1).split(",") if tag != "snd"]
          html = html[:match.start(1)] + ",".join(tags) + html[match.end(1):]

          path.write_text(html, encoding="utf-8")
          print("Browser audio bootstrap disabled; obsolete BrowserFS tag removed.")
          PY

      - name: Verify browser startup configuration and disable Jekyll
        run: |
          test -f build/web/index.html
          grep -Eq 'ume_block[[:space:]]*:[[:space:]]*0' build/web/index.html
          ! grep -q 'browserfs.min.js' build/web/index.html
          ! grep -Eq 'data-os="[^"]*snd' build/web/index.html
          touch build/web/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
